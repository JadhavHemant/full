# Prometheus configuration for ERP API Server
# Save this file and run Prometheus with:
#   prometheus --config.file=prometheus.yml
#
# To install Prometheus: https://prometheus.io/download/
# To install Grafana:    https://grafana.com/grafana/download

global:
  scrape_interval: 15s      # How often to scrape targets
  evaluation_interval: 15s  # How often to evaluate alerting rules

# Alerting configuration (Alertmanager)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Rule files for alerting and recording rules
rule_files:
  # - "alerting_rules.yml"
  # - "recording_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Our ERP API Server
  - job_name: 'erp-api-server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:5351']
    # Add labels for easier filtering in Grafana
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'erp-api-server'

  # Optional: Node Exporter for system metrics (CPU, memory, disk)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['localhost:9100']